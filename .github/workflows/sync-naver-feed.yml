name: 네이버 블로그 목록 동기화

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_naver_feed.py'
      - '.github/workflows/sync-naver-feed.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: naver-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 동기화 스크립트 가져오기
        uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: scripts
      - name: 현재 배포 파일 가져오기
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: 공개 RSS 전체 목록 저장
        run: python3 source/scripts/sync_naver_feed.py --output pages/naver-posts.json
      - name: 변경된 목록만 배포
        working-directory: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add naver-posts.json
          if git diff --cached --quiet; then
            if [ "${{ github.event_name }}" = "push" ]; then
              gh api --method POST "repos/${{ github.repository }}/pages/builds" > /dev/null
            fi
            exit 0
          fi
          git commit -m '네이버 블로그 글 목록 동기화'
          git push origin HEAD:gh-pages
          gh api --method POST "repos/${{ github.repository }}/pages/builds" > /dev/null
